name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "BILINEXT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BILINEXT_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Show build environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Install build and runtime dependencies
        run: brew install mpv pkgconf

      - name: Cache Swift build products
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-macos26-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}

      - name: Check format and run offline tests
        run: |
          bash scripts/check-format.sh
          swift test --no-parallel

      - name: Build release archive
        run: |
          bash scripts/build-release.sh
          echo "ZIP=dist/BiliNext-${BILINEXT_VERSION}-arm64.zip" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "dist/BiliNext-${BILINEXT_VERSION}-arm64.zip" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Verify release bundle
        run: |
          set -euo pipefail
          test -x build/BiliNext.app/Contents/MacOS/BiliNext
          cmp Resources/BiliNext.icns build/BiliNext.app/Contents/Resources/BiliNext.icns
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/BiliNext.app/Contents/Info.plist)" = "$BILINEXT_VERSION"
          codesign --verify --deep --strict build/BiliNext.app
          test ! -d build/BiliNext.app/Contents/Frameworks
          otool -L build/BiliNext.app/Contents/MacOS/BiliNext

      - name: Ensure manual release tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          else
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi

      - name: Publish GitHub Release
        run: |
          printf 'macOS 26+, Apple Silicon. Requires Homebrew mpv.\n\nAd-hoc signed; not notarized. The Homebrew cask prints the quarantine-removal command before running it. Keychain authorization may be needed after upgrading.\n\nSHA-256: `%s`\n' "$SHA256" > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "BiliNext $BILINEXT_VERSION" --notes-file release-notes.md
          fi

      - name: Update Homebrew tap
        if: env.TAP_DEPLOY_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/bilinext_homebrew_tap
          chmod 600 ~/.ssh/bilinext_homebrew_tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/bilinext_homebrew_tap -o IdentitiesOnly=yes"
          git clone git@github.com:nickxudotme/homebrew-tap.git "$RUNNER_TEMP/homebrew-tap"
          python3 scripts/update-homebrew.py "$BILINEXT_VERSION" "$SHA256" "$RUNNER_TEMP/homebrew-tap"
          cd "$RUNNER_TEMP/homebrew-tap"
          ruby -c Casks/bilinext.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/bilinext.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update BiliNext to $BILINEXT_VERSION"
            git push
          fi

      - name: Missing tap deploy key notice
        if: env.TAP_DEPLOY_KEY == ''
        run: echo '::warning::TAP_DEPLOY_KEY is missing; release succeeded but the cask must be updated manually.'
